# Intentionally package-only; no provisioning, hosting, upload or tenant writes.
# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.11/yaml.schema.json
version: v1.11
provision:
  - uses: cli/runNpmCommand
    with:
      args: run blocked:provision
deploy:
  - uses: cli/runNpmCommand
    with:
      args: run build
  - uses: cli/runNpmCommand
    with:
      args: run package:check
publish:
  - uses: cli/runNpmCommand
    with:
      args: run blocked:provision
