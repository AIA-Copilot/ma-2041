# Adapted from pinned Microsoft ProxyAgent-CSharp. Local host only; no SSO.
# yaml-language-server: $schema=https://aka.ms/teams-toolkit/v1.11/yaml.schema.json
version: v1.11
environmentFolderPath: ./env
provision:
  - uses: teamsApp/create
    with:
      name: ContosoPolicyLab
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID
  - uses: aadApp/create
    with:
      name: ContosoPolicyLabBot
      generateClientSecret: true
      generateServicePrincipal: true
      clientSecretExpireDays: 7
      clientSecretDescription: AI3026-private-VM-lab
      signInAudience: AzureADMyOrg
    writeToEnvironmentFile:
      clientId: BOT_ID
      clientSecret: SECRET_BOT_PASSWORD
      objectId: BOT_OBJECT_ID
      tenantId: BOT_TENANT_ID
  - uses: arm/deploy
    with:
      subscriptionId: ${{AZURE_SUBSCRIPTION_ID}}
      resourceGroupName: ${{AZURE_RESOURCE_GROUP_NAME}}
      templates:
        - path: ./infra/bot.bicep
          parameters: ./infra/bot.parameters.json
          deploymentName: contoso-policy-lab-bot
      bicepCliVersion: v0.38.33
  - uses: file/createOrUpdateJsonFile
    with:
      target: ../Proxy/appsettings.Development.json
      content:
        TokenValidation:
          Audiences: ["${{BOT_ID}}"]
          ValidIssuers: ["https://api.botframework.com"]
        Connections:
          BotServiceConnection:
            Settings:
              AuthType: ClientSecret
              TenantId: ${{BOT_TENANT_ID}}
              ClientId: ${{BOT_ID}}
              ClientSecret: ${{SECRET_BOT_PASSWORD}}
              Scopes: ["https://api.botframework.com/.default"]
        Foundry:
          ProjectEndpoint: ${{FOUNDRY_PROJECT_ENDPOINT}}
          AgentName: ${{FOUNDRY_AGENT_NAME}}
          AgentVersion: ${{FOUNDRY_AGENT_VERSION}}
deploy:
  - uses: teamsApp/validateManifest
    with:
      manifestPath: ./appPackage/manifest.json
  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build
  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
  - uses: teamsApp/extendToM365
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
    writeToEnvironmentFile:
      titleId: M365_TITLE_ID
      appId: M365_APP_ID
